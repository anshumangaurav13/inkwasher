<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="paperGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#faf8f2"/>
      <stop offset="70%" stop-color="#ede9df"/>
      <stop offset="100%" stop-color="#dfdacd"/>
    </radialGradient>

    <!-- Indigo Fluid Bloom -->
    <radialGradient id="indigoWash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a3c5a" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#3b5278" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#6b86ad" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8fa6c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Sumi Ink Drop -->
    <linearGradient id="sumiInk" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#2d2d3c"/>
      <stop offset="50%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="inkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#16161e" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Squircle Canvas Frame -->
  <rect width="512" height="512" rx="116" fill="url(#paperGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#d6d0c0" stroke-width="2.5" opacity="0.6"/>

  <!-- Fluid Watercolor Bloom Rings -->
  <circle cx="256" cy="270" r="190" fill="url(#indigoWash)"/>
  
  <path d="M256,120 C340,120 410,185 410,270 C410,355 340,420 256,420 C172,420 102,355 102,270 C102,185 172,120 256,120 Z" 
        fill="none" stroke="#48628a" stroke-width="5" stroke-dasharray="16 10" opacity="0.45"/>
        
  <path d="M256,155 C320,155 375,205 375,270 C375,335 320,385 256,385 C192,385 137,335 137,270 C137,205 192,155 256,155 Z" 
        fill="none" stroke="#2b3e5e" stroke-width="3" stroke-dasharray="8 12" opacity="0.3"/>

  <!-- Living Water Droplet Splash / Pen Nib Splat -->
  <g filter="url(#inkShadow)">
    <path d="M256,88 
             C256,88 348,220 348,300 
             C348,352 307,392 256,392 
             C205,392 164,352 164,300 
             C164,220 256,88 256,88 Z" 
          fill="url(#sumiInk)"/>
  </g>

  <!-- Droplet Surface Tension Highlight -->
  <path d="M220,195 C235,165 256,125 256,125 C256,125 240,170 230,210 C222,242 225,270 220,275 C215,280 205,275 205,250 C205,230 212,210 220,195 Z" 
        fill="#ffffff" opacity="0.4"/>
  <ellipse cx="232" cy="336" rx="14" ry="8" transform="rotate(-30 232 336)" fill="#ffffff" opacity="0.25"/>

  <!-- Asian Red Artist Seal (Hanko: "洗" / Wash) -->
  <rect x="345" y="345" width="68" height="68" rx="14" fill="#a82828" opacity="0.92"/>
  <rect x="349" y="349" width="60" height="60" rx="11" fill="none" stroke="#faf8f2" stroke-width="2" opacity="0.8"/>
  <text x="379" y="388" font-family="'Songti SC', 'Yu Mincho', serif" font-size="34" font-weight="bold" fill="#faf8f2" text-anchor="middle">洗</text>
</svg>
